<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление камерой</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #121212; color: #fff; }
        .gallery { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px; }
        .photo-card { background: #1e1e1e; padding: 10px; border-radius: 8px; text-align: center; }
        .photo-card img { max-width: 200px; height: auto; border-radius: 4px; display: block; margin-bottom: 8px; }
        .photo-card a { color: #4da6ff; text-decoration: none; word-break: break-all; }
        .photo-card a:hover { text-decoration: underline; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Стрим и управление</h1>

    <img src="/video.mjpg" width="640" height="480" alt="Video Stream"><br><br>

    <button id="captureBtn" onclick="takePhoto()">Сделать фото</button>

    <h2>Галерея снимков</h2>
    <div id="photosGallery" class="gallery">
        <p>Загрузка фотографий...</p>
    </div>

    <script>
        async function loadPhotos() {
            try {
                const response = await fetch('/api/photos');
                const data = await response.json();
                const container = document.getElementById('photosGallery');

                if (!data.photos || data.photos.length === 0) {
                    container.innerHTML = '<p>Снимков пока нет</p>';
                    return;
                }

                container.innerHTML = '';

                data.photos.forEach(filename => {
                    const photoUrl = `/photos/${filename}`;

                    const card = document.createElement('div');
                    card.className = 'photo-card';

                    card.innerHTML = `
                        <a href="${photoUrl}" target="_blank">
                            <img src="${photoUrl}" alt="${filename}" loading="lazy">
                        </a>
                        <a href="${photoUrl}" target="_blank">${filename}</a>
                    `;

                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Ошибка загрузки фотографий:', err);
                document.getElementById('photosGallery').innerHTML = '<p>Не удалось загрузить фотографии</p>';
            }
        }

        async function takePhoto() {
            const btn = document.getElementById('captureBtn');
            btn.disabled = true;
            try {
                const response = await fetch('/capture', { method: 'POST' });
                const result = await response.json();
                if (result.status === 'ok') {
                    await loadPhotos();
                }
            } catch (err) {
                console.error('Ошибка создания фото:', err);
            } finally {
                btn.disabled = false;
            }
        }

        loadPhotos();
    </script>
</body>
</html>
