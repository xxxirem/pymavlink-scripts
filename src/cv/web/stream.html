<!DOCTYPE html>
<html>
<head>
    <title>Pi Zero 2 W - ArUco Fast</title>
    <style>
        body { background: #121212; color: #fff; text-align: center; font-family: monospace; }
        img { max-width: 100%; border: 2px solid #00ff88; border-radius: 8px; }
        #info { margin-top: 15px; font-size: 1.2rem; color: #00ff88; }

        /* Стили для кнопки */
        .btn-capture {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: bold;
            color: #121212;
            background-color: #00ff88;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-capture:hover {
            background-color: #00cc6d;
        }

        .btn-capture:active {
            transform: scale(0.96);
        }

        .btn-capture:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h2>Optimized ArUco Detector</h2>
    <img src="/video.mjpg" width="640" height="480" />
    <div id="info">Ожидание данных...</div>

    <button class="btn-capture" id="captureBtn" onclick="takeSnapshot()">Сделать снимок</button>

    <script>
        async function takeSnapshot() {
            const btn = document.getElementById('captureBtn');
            btn.disabled = true;

            try {
                let res = await fetch('/capture', { method: 'POST' });
                if (res.ok) {
                    console.log('Снимок успешно сохранен');
                } else {
                    console.error('Ошибка при создании снимка');
                }
            } catch(e) {
                console.error('Ошибка сети:', e);
            } finally {
                btn.disabled = false;
            }
        }
    </script>

    <h2>Галерея снимков</h2>
    <div id="photosGallery" class="gallery">
        <p>Загрузка фотографий...</p>
    </div>

    <script>
        async function loadPhotos() {
            try {
                const response = await fetch('/api/photos');
                const data = await response.json();
                const container = document.getElementById('photosGallery');

                if (!data.photos || data.photos.length === 0) {
                    container.innerHTML = '<p>Снимков пока нет</p>';
                    return;
                }

                container.innerHTML = '';

                data.photos.forEach(filename => {
                    const photoUrl = `/photos/${filename}`;

                    const card = document.createElement('div');
                    card.className = 'photo-card';

                    card.innerHTML = `
                        <a href="${photoUrl}" target="_blank">
                            <img src="${photoUrl}" alt="${filename}" loading="lazy">
                        </a>
                        <a href="${photoUrl}" target="_blank">${filename}</a>
                    `;

                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Ошибка загрузки фотографий:', err);
                document.getElementById('photosGallery').innerHTML = '<p>Не удалось загрузить фотографии</p>';
            }
        }

        async function takePhoto() {
            const btn = document.getElementById('captureBtn');
            btn.disabled = true;
            try {
                const response = await fetch('/capture', { method: 'POST' });
                const result = await response.json();
                if (result.status === 'ok') {
                    await loadPhotos();
                }
            } catch (err) {
                console.error('Ошибка создания фото:', err);
            } finally {
                btn.disabled = false;
            }
        }
        loadPhotos();
    </script>

</body>
</html>
